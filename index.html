<script>
(function(){
  'use strict';
  var iframe=document.getElementById('gsaa-chennai-mobile-frame');
  if(!iframe) return;
  // HtmlService may be nested: the message source is often the *inner*
  // googleusercontent frame, not the script.google.com iframe WindowProxy.
  var googleOrigin=/^https:\/\/(?:script\.google\.com|(?:[a-z0-9-]+\.)*googleusercontent\.com)$/i;
  var childWindow=null, childOrigin=null, lastHeight=0, queued=false;

  function isTrusted(ev){return googleOrigin.test(ev.origin||'') && !!ev.source;}
  function visibleViewport(){
    queued=false;
    if(!childWindow) return;
    var rect=iframe.getBoundingClientRect();
    var visual=window.visualViewport;
    var viewportTop=visual ? visual.offsetTop : 0;
    var viewportHeight=visual ? visual.height : window.innerHeight;
    var from=Math.max(0,viewportTop-rect.top);
    var to=Math.min(rect.height,viewportTop+viewportHeight-rect.top);
    var amount=to-from;
    if(amount<100) return;
    try{
      childWindow.postMessage({
        type:'GSAA_EMBED_VISIBLE_VIEWPORT',
        shareToken:gsaaSessionToken,
        top:Math.round(from),
        height:Math.round(Math.min(1600,amount))
      },childOrigin);
    }catch(e){}
  }
  function queueViewport(){
    if(queued) return;
    queued=true;
    requestAnimationFrame(visibleViewport);
  }
  window.addEventListener('message',function(ev){
    if(!isTrusted(ev))return;
    var data=ev.data;
    if(!data || (data.type!=='GSAA_CHENNAI_READY' && data.type!=='GSAA_CHENNAI_HEIGHT' && data.type!=='GSAA_EMBED_SCROLL_TO'))return;
    // Register the real child window from a trusted Google origin.
    // This works both directly and through Google's extra HTML-service iframe.
    if(childWindow && childWindow!==ev.source)return;
    childWindow=ev.source;
    childOrigin=ev.origin;
    if(data.type==='GSAA_CHENNAI_READY'){
      queueViewport();
      return;
    }
    if(data.type==='GSAA_EMBED_SCROLL_TO'){
      var offset=Number(data.top);
      if(Number.isFinite(offset) && offset>=0 && offset<25000){
        var pageY=window.scrollY+iframe.getBoundingClientRect().top+offset-12;
        window.scrollTo({top:Math.max(0,Math.round(pageY)),behavior:data.behavior==='instant'?'instant':'smooth'});
      }
      return;
    }
    var h=Number(data.height);
    if(!Number.isFinite(h)||h<300||h>25000)return;
    h=Math.ceil(h);
    if(Math.abs(h-lastHeight)>=2){
      lastHeight=h;
      // Absolute CONTENT height. Never use current iframe/client scrollHeight.
      iframe.style.setProperty('height',h+'px','important');
    }
    queueViewport();
  });
  iframe.addEventListener('load',queueViewport);
  window.addEventListener('scroll',queueViewport,{passive:true});
  window.addEventListener('resize',queueViewport,{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('scroll',queueViewport,{passive:true});
    window.visualViewport.addEventListener('resize',queueViewport,{passive:true});

        invite:'7 दिसंबर से पहले यह संदेश लाखों लोगों तक पहुँचना चाहिए, और आपके सहयोग के बिना यह संभव नहीं है। इसे अपने सभी WhatsApp ग्रुप और परिचितों तक पहुँचाएँ, ताकि वे भी पंजीकरण कर सकें और गौ माता की रक्षा एवं सम्मान में सहभागी बन सकें।',
        action:'🟢 सर्टिफिकेट की फोटो + संदेश WhatsApp पर शेयर करें',cancel:'शेयर रद्द हुआ। दोबारा बटन दबाएँ।',
        unsupported:'इस ब्राउज़र में सीधे फोटो शेयर करने की अनुमति नहीं है। सर्टिफिकेट डाउनलोड करके WhatsApp पर भेजें। Chrome में दोबारा कोशिश भी कर सकते हैं।',
        error:'शेयर विकल्प नहीं खुला',download:'⬇ सर्टिफिकेट की JPG डाउनलोड करें',text:'केवल WhatsApp संदेश खोलें',close:'अभी नहीं',working:'फोन का शेयर विकल्प खुल रहा है… उसमें WhatsApp चुनें।'},

        action:'🟢 சான்றிதழ் படம் + செய்தியை WhatsApp-ல் பகிரவும்',cancel:'பகிர்வு ரத்தானது. மீண்டும் முயலவும்.',

        error:'பகிர்வு திறக்கவில்லை',download:'⬇ சான்றிதழ் JPG பதிவிறக்கவும்',text:'WhatsApp செய்தி மட்டும்',close:'பின்னர்',working:'பகிர்வு விருப்பங்கள் திறக்கப்படுகின்றன… WhatsApp-ஐத் தேர்ந்தெடுக்கவும்.'}
    })[gsaaShareLang] || gsaaLabelsHindiFallback();
  }
  function gsaaLabelsHindiFallback(){return {
    title:'पंजीकरण सफल रहा!',thanks:'🙏 पंजीकरण के लिए धन्यवाद!',
    invite:'कृपया यह संदेश अपने सभी परिचितों तक पहुँचाएँ।',
    action:'🟢 फोटो और संदेश शेयर करें',cancel:'शेयरिंग रद्द हुई।',
    unsupported:'इस ब्राउज़र में फोटो शेयर नहीं हो रही; डाउनलोड कर भेजें।',error:'शेयरिंग नहीं खुली',
    download:'⬇ सर्टिफिकेट डाउनलोड करें',text:'केवल संदेश भेजें',close:'अभी नहीं',working:'शेयरिंग खुल रही है…'};}
  function gsaaRemoveShareDialog(){
    if(gsaaShareDialog){gsaaShareDialog.remove();gsaaShareDialog=null;}
    if(gsaaShareObjectUrl){URL.revokeObjectURL(gsaaShareObjectUrl);gsaaShareObjectUrl=null;}
    gsaaShareStatusElement=null;
  }
  function gsaaSetShareStatus(message, isError){
    if(!gsaaShareStatusElement) return;
    gsaaShareStatusElement.textContent=message;
    gsaaShareStatusElement.style.color=isError?'#a12d20':'#725542';
  }
  function gsaaCanShareImage(){
    if(!gsaaShareFile || typeof navigator.share!=='function')return false;
    if(typeof navigator.canShare==='function'){
      try{return navigator.canShare({files:[gsaaShareFile]});}catch(e){return false;}
    }
    return false;
  }
  function gsaaNativeShareOnParentClick(){
    var l=gsaaLabels();
    if(gsaaShareBusy)return;
    if(!gsaaCanShareImage()) {gsaaSetShareStatus(l.unsupported,true);return;}
    gsaaShareBusy=true;
    var operation;
    try{
      // DO NOT await, setTimeout, postMessage or create a file before this call.
      // The certificate File has already been prepared and cached above.
      operation=navigator.share({
        files:[gsaaShareFile],
        text:gsaaShareText,
        title:'Gau Samman Aahvaan Abhiyan'
      });
      gsaaSetShareStatus(l.working,false);
    }catch(err){
      gsaaShareBusy=false;
      gsaaSetShareStatus(l.error+' ('+(err.name||'error')+'): '+(err.message||''),true);
      return;
    }
    Promise.resolve(operation).then(function(){
      gsaaShareBusy=false;
      gsaaAckShare('shared');
      gsaaRemoveShareDialog();
    }).catch(function(err){
      gsaaShareBusy=false;
      if(err && err.name==='AbortError'){
        gsaaSetShareStatus(l.cancel,false);
      }else{
        gsaaSetShareStatus(l.error+' ('+((err&&err.name)||'error')+'): '+((err&&err.message)||l.unsupported),true);
      }
      // The panel stays visible. Never close it on an error/cancellation.
    });
  }

  function gsaaReceiveCertificate(ev,d){
    if(!isTrusted(ev) || !d || d.shareToken!==gsaaSessionToken)return;
    var f=d.file;
    if(!f || !/^image\/(jpeg|png|webp)$/.test(String(f.type||'')) || !(f.size>0 && f.size<9000000))return;
    try{
      gsaaShareFile=f instanceof File ? f : new File([f],String(f.name||'Gau-Samman-Certificate.jpg'),{type:f.type});
    }catch(e){return;}
    gsaaShareSource=ev.source;
    gsaaShareSourceOrigin=ev.origin;
    gsaaShareText=String(d.text||'').slice(0,12000);
    gsaaShareLang=['hi','en','ta'].includes(d.language)?d.language:'hi';
    // Never invoke navigator.share from a postMessage handler: the real user
    // gesture occurred in another browsing context and may not transfer.
    gsaaShowShareDialog();
  }
  window.addEventListener('message',function(ev){
    if(!isTrusted(ev))return;
    var d=ev.data;
    if(!d || (d.type!=='GSAA_CHENNAI_CERT_READY' && d.type!=='GSAA_CHENNAI_SHARE_CERTIFICATE'))return;
    gsaaReceiveCertificate(ev,d);
  });
